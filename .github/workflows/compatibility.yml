name: Compatibility Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'docker/Dockerfile.jvm-package'
      - 'compatibility-tests/**'
      - '.github/workflows/compatibility.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build atlas image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build JVM artifact
        run: mvn clean package -DskipTests -q

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: docker/Dockerfile.jvm-package
          tags: atlas:test
          outputs: type=docker,dest=/tmp/atlas-image.tar
          cache-from: type=gha,scope=atlas
          cache-to: type=gha,scope=atlas,mode=max

      - name: Compress image
        run: gzip /tmp/atlas-image.tar

      - name: Upload atlas image
        uses: actions/upload-artifact@v7
        with:
          name: atlas-image
          path: /tmp/atlas-image.tar.gz
          retention-days: 1

  compat-test:
    name: ${{ matrix.test }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test:
          - sdk-test-node
          - sdk-test-python
          - sdk-test-java # improving execution time
          - sdk-test-go
          - sdk-test-awscli
          - compat-cdk
          - compat-terraform
          - compat-opentofu

    steps:
      - name: Download atlas image
        uses: actions/download-artifact@v8
        with:
          name: atlas-image
          path: /tmp

      - name: Load atlas image
        run: gunzip -c /tmp/atlas-image.tar.gz | docker load

      - name: Create Docker network
        run: docker network create compat-net

      - name: Start atlas
        run: |
          DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)
          docker run -d --name atlas --network compat-net \
            -p 4566:4566 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --group-add "$DOCKER_GID" \
            -e ATLAS_BASE_URL=http://atlas:4566 \
            -e ATLAS_SERVICES_DOCKER_NETWORK=compat-net \
            -e ATLAS_HOSTNAME=atlas \
            -e ATLAS_SERVICES_LAMBDA_HOT_RELOAD_ENABLED=true \
            -e ATLAS_TLS_ENABLED=true \
            atlas:test

      - name: Wait for atlas to be ready
        run: timeout 60 bash -c 'until curl -sf http://localhost:4566/ >/dev/null 2>&1; do sleep 1; done'

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: compatibility-tests

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build test image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: compatibility-tests/${{ matrix.test }}
          load: true
          tags: compat-${{ matrix.test }}
          cache-from: type=gha,scope=${{ matrix.test }}
          cache-to: type=gha,scope=${{ matrix.test }},mode=max

      - name: Run tests
        id: tests
        run: |
          mkdir -p test-results
          ATLAS_IP=$(docker inspect -f '{{(index .NetworkSettings.Networks "compat-net").IPAddress}}' atlas)
          DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)

          EXTRA_ARGS=""
          # compat-cdk needs Docker access for CDK's DockerImageFunction (docker build + push to emulated ECR)
          if [ "${{ matrix.test }}" = "compat-cdk" ]; then
            EXTRA_ARGS="-v /var/run/docker.sock:/var/run/docker.sock --group-add $DOCKER_GID"
          fi

          # sdk-test-java: mount a host-side directory so the Docker daemon can
          # bind-mount hot-reload code paths that are written by the test container.
          if [ "${{ matrix.test }}" = "sdk-test-java" ]; then
            mkdir -p /tmp/atlas-hot-reload
            EXTRA_ARGS="$EXTRA_ARGS -v /tmp/atlas-hot-reload:/tmp/atlas-hot-reload -e HOT_RELOAD_BASE_DIR=/tmp/atlas-hot-reload"
          fi

          # --dns injects Atlas's embedded DNS so *.atlas wildcard subdomains
          # (e.g. my-bucket.atlas) resolve to Atlas's IP inside the test container.
          # ATLAS_S3_VHOST_ENDPOINT tells the S3 virtual-host client to use
          # http://atlas:4566 as the endpoint base instead of the public DNS fallback.
          docker run --rm --network compat-net \
            --dns "${ATLAS_IP}" \
            -e ATLAS_ENDPOINT=http://atlas:4566 \
            -e ATLAS_S3_VHOST_ENDPOINT=http://atlas:4566 \
            -v "$(pwd)/test-results:/results" \
            $EXTRA_ARGS \
            compat-${{ matrix.test }}

      - name: Generate test summary
        if: always() && steps.tests.outcome != 'skipped'
        uses: test-summary/action@31493c76ec9e7aa675f1585d3ed6f1da69269a86 # v2
        with:
          paths: test-results/*.xml

      - name: Dump atlas logs
        if: failure()
        run: docker logs atlas
