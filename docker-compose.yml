services:
  atlas:
    build:
      context: .
      dockerfile: docker/Dockerfile
    tty: true
    ports:
      - "4566:4566"
      - "6379-6399:6379-6399"
      - "7001-7099:7001-7099"
      - "9200-9299:9200-9299"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    environment:
      ATLAS_SERVICES_DOCKER_NETWORK: atlas_default
      ATLAS_SERVICES_RDS_PROXY_BASE_PORT: "7001"
      ATLAS_HOSTNAME: atlas
      ATLAS_BASE_URL: http://atlas:4566
      ATLAS_SERVICES_LAMBDA_HOT_RELOAD_ENABLED: "true"
    networks:
      atlas_default:
        aliases:
          - localhost.atlas.local

networks:
  atlas_default:
    name: atlas_default
